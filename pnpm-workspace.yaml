# pnpm 10 skips dependency lifecycle scripts unless they are approved.
# allowBuilds replaces onlyBuiltDependencies (still accepted, deprecated in 10.26+).
overrides:
   postcss: 8.5.25
   zod: 4.6.7

allowBuilds:
   prisma: true
   '@prisma/client': true
   '@prisma/engines': true
   esbuild: true
   husky: true
   sharp: true
